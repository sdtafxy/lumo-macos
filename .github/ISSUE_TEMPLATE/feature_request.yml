name: 功能建议
description: 提一个改进想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议之前，有两件事值得先看一眼——它们能解释"为什么这个明显该有的功能还没有"：

        - **设计文档的第 11 节「设计取舍记录」**（App 里 `帮助 → 查看设计文档`）：
          里面写了每个取舍的理由，包括那些被**实测否决**过的选项。
          一个建议如果只是「我觉得更好」，很可能撞在这上面。
        - **`README.md` 的「已知限制」**：已知但尚未解决的问题清单。

        这个项目有两个性格是不会为了功能让步的，请先确认你的建议不与之冲突：
        **零第三方依赖**、**除自动更新外不联网**。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的是什么问题
      description: 请描述**问题**，而不是直接跳到方案。这样我能判断有没有更合适的做法
      placeholder: |
        我在做……的时候，必须……，这很麻烦，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 如果有多种做法，说说你倾向哪一种、为什么
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕过去的
      description: 临时办法往往能说明这个功能实际有多重要
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我查过 README 的「已知限制」，这不是其中之一
          required: true
        - label: 这个建议不需要引入第三方依赖、也不需要新增联网（除非在正文里说明了理由）
          required: true
