# 让 Dependabot 盯着 GitHub Actions 的版本。
#
# 为什么只配这一个生态：这个项目的**运行时代码零第三方依赖**（只用系统框架），
# 所以没有 npm / pip / SPM 的依赖需要更新。但 `.github/workflows/` 里
# 用了一堆 `actions/*` 与第三方 action，它们的版本会过期，
# 而过期的 action 是供应链攻击的常见入口。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 首次接入时 Dependabot 会**立刻**跑一次（不看 schedule），一次开出好几个 PR。
    #
    # 所以下面两条是刻意的：`groups` 把一批更新合成**一个** PR；
    # 上限设成 1，是因为仓库首页挂着一排机器人 PR 既没信息量，
    # 又容易被顺手合掉——而 action 的**大版本**升级是可能把 CI 弄坏的。
    # 宁可一个月看一次，也不要一次看十条。
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
